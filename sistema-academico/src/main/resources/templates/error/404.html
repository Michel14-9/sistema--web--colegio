<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-container {
            background: white;
            border-radius: 20px;
            padding: 60px 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 50px;
            color: white;
        }
        .error-icon i { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); }
        .error-status {
            font-size: 80px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 5px;
        }
        .error-title {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 12px;
        }
        .error-message {
            font-size: 18px;
            color: #34495e;
            margin-bottom: 8px;
        }
        .error-description {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .error-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .btn-secondary-custom {
            background: white;
            color: #2c3e50;
            border: 2px solid #e9ecef;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-secondary-custom:hover {
            background: #f8f9fa;
            border-color: #667eea;
            color: #2c3e50;
        }
        @media (max-width: 576px) {
            .error-container { padding: 40px 25px; }
            .error-status { font-size: 60px; }
            .error-title { font-size: 22px; }
            .error-message { font-size: 16px; }
            .error-icon { width: 90px; height: 90px; font-size: 38px; }
            .btn-primary-custom, .btn-secondary-custom {
                padding: 10px 20px;
                font-size: 14px;
                width: 100%;
                justify-content: center;
            }
            .error-buttons { flex-direction: column; align-items: stretch; }
        }
        @media (max-width: 400px) {
            .error-container { padding: 30px 20px; }
            .error-status { font-size: 48px; }
            .error-title { font-size: 18px; }
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-icon">
        <i th:class="${icono}"></i>
    </div>
    <div class="error-status" th:text="${status}">404</div>
    <h1 class="error-title" th:text="${error}">Página no encontrada</h1>
    <p class="error-message" th:text="${message}">Lo sentimos, la página que buscas no existe.</p>
    <p class="error-description" th:text="${descripcion}">La URL que intentaste acceder no está disponible. Verifica que la dirección sea correcta.</p>

    <div style="background: #f8f9fa; padding: 10px 15px; border-radius: 8px; margin-bottom: 30px;">
        <p style="margin: 0; font-size: 13px; color: #6c757d;">
            <i class="fas fa-info-circle"></i>
            <span th:text="${path}">La página solicitada no existe</span>
        </p>
    </div>

    <div class="error-buttons">

        <a href="javascript:history.back()" class="btn-secondary-custom">
            <i class="fas fa-arrow-left"></i> Volver atrás
        </a>
    </div>
</div>
</body>
</html>
