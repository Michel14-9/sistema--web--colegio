<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Seleccionar Estudiante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/docente.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/docente-navbar :: navbar}" th:with="tituloPagina='Seleccionar Estudiante'"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/docente-sidebar :: sidebar}" th:with="modulo='reportes'"></div>

        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 main-content">
            <div class="page-header">
                <h1><i class="fas fa-user-graduate"></i> Seleccionar Estudiante</h1>
                <p>Selecciona un estudiante para generar su boletín individual</p>
            </div>

            <div class="content-card">
                <div class="card-header-custom">
                    <div class="header-title">
                        <i class="fas fa-book"></i>
                        <h4>Curso: <span th:text="${curso.nombreCurso}"></span></h4>
                    </div>
                    <div class="header-count">
                        <span class="total-count" th:text="${#lists.size(estudiantes)}">0</span> estudiantes
                    </div>
                </div>
                <div class="card-body-custom p-0">
                    <div class="table-responsive">
                        <table class="table table-modern">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Código</th>
                                <th>DNI</th>
                                <th>Nombres</th>
                                <th>Apellidos</th>
                                <th>Acción</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="estudiante, iterStat : ${estudiantes}">
                                <td th:text="${iterStat.count}">1</td>
                                <td th:text="${estudiante.codigoEstudiante}">-</td>
                                <td th:text="${estudiante.dni}">-</td>
                                <td th:text="${estudiante.nombres}">-</td>
                                <td th:text="${estudiante.apellidoPaterno} + ' ' + ${estudiante.apellidoMaterno}">-</td>
                                <td>
                                    <a th:href="@{/docente/reportes/boletin/{id}(id=${estudiante.idEstudiante}, idCurso=${curso.idCurso})}"
                                       class="btn btn-primary btn-sm"
                                       target="_blank">
                                        <i class="fas fa-file-pdf"></i> Generar Boletín
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${estudiantes == null or estudiantes.empty}">
                                <td colspan="6" class="text-center py-5">
                                    <i class="fas fa-users fa-3x text-muted mb-2 d-block"></i>
                                    No hay estudiantes matriculados en este curso.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer-custom">
                    <a href="/docente/docentes-reportes" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> Volver a Reportes
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
