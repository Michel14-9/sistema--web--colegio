<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Iniciar Sesión</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS propio -->
    <link th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body>

<div class="login-container">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-5 col-md-7 col-11">

                <!-- Logo / Marca -->
                <div class="text-center mb-4">
                    <div class="login-logo">
                        <img th:src="@{/img/logo.png}" alt="Logo I.E. San Carlos">
                    </div>
                    <h1 class="login-brand">I.E. San Carlos</h1>
                    <p class="login-brand-sub">Sistema de Gestión Académica</p>
                </div>

                <!-- Tarjeta de Login -->
                <div class="card login-card">
                    <div class="card-body">
                        <h3 class="login-title">Bienvenido</h3>
                        <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

                        <form id="loginForm" th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <div class="input-group">
                                    <span class="input-icon">
                                        <i class="fas fa-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control" name="email" id="email"
                                           placeholder="Correo electrónico" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <div class="input-group">
                                    <span class="input-icon">
                                        <i class="fas fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control" name="password" id="password"
                                           placeholder="Contraseña" required>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label" for="remember">Recordarme</label>
                                </div>
                                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                            </div>

                            <button type="submit" class="btn btn-ingresar w-100">
                                <i class="fas fa-arrow-right-to-bracket"></i> Iniciar Sesión
                            </button>
                        </form>

                        <div class="login-footer">
                            <a th:href="@{/}" class="back-home">
                                <i class="fas fa-home"></i> Volver al inicio
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Información adicional -->
                <div class="text-center mt-4">
                    <p class="help-text">
                        <i class="fas fa-question-circle"></i> ¿Problemas para acceder?
                        <a href="#">Contáctanos</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
