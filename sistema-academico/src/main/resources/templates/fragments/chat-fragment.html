<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="chatWidget">
    <link th:href="@{/css/chat-widget.css}" rel="stylesheet">

    <button class="chat-toggle-btn" id="chatToggleBtn">
        <i class="fas fa-comment-dots" id="chatIcon"></i>
    </button>

    <div class="chat-widget" id="chatWidget">
        <div class="chat-widget-header">
            <div class="chat-widget-title">
                <i class="fas fa-robot"></i>
                <span>Asistente Virtual</span>
            </div>
            <button class="chat-widget-close" id="chatWidgetClose">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="chat-widget-body">
            <iframe th:src="@{/chat?embed=true}" class="chat-widget-iframe" frameborder="0"></iframe>
        </div>
    </div>

    <script th:src="@{/js/chat-widget.js}"></script>
</div>
</body>
</html>
