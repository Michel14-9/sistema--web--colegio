<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div class="col-md-2 col-lg-2 d-md-block sidebar p-0" th:fragment="sidebar">
    <div class="sidebar-menu">
        <div class="user-info text-center">
            <div class="user-avatar">
                <img th:src="@{/img/logo.png}" alt="Logo" class="avatar-img">
            </div>
            <h5 th:text="${docente.nombres} + ' ' + ${docente.apellidoPaterno}"></h5>
            <p><i class="fas fa-id-card"></i> <span th:text="${docente.dni}">-</span></p>
            <p><i class="fas fa-envelope"></i> <span th:text="${docente.email}">-</span></p>
            <p><i class="fas fa-graduation-cap"></i> <span th:text="${docente.especialidad}">-</span></p>
        </div>
        <ul class="nav flex-column">
            <!-- Dashboard -->
            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'dashboard'} ? 'active' : ''" href="/docente/dashboard">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
            </li>

            <!-- Mis Cursos -->
            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'cursos'} ? 'active' : ''" href="/docente/mis-cursos">
                    <i class="fas fa-book-open"></i> Mis Cursos
                    <span class="badge bg-success ms-1" th:text="${totalCursos}">0</span>
                </a>
            </li>

            <!-- Mi Horario -->
            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'horario'} ? 'active' : ''" href="/docente/horario">
                    <i class="fas fa-calendar-alt"></i> Mi Horario
                </a>
            </li>

            <!-- Mis Alumnos -->
            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'alumnos'} ? 'active' : ''" href="/docente/alumnos">
                    <i class="fas fa-users"></i> Mis Alumnos
                    <span class="badge bg-info ms-1" th:text="${totalAlumnos}">0</span>
                </a>
            </li>

            <!-- Gestionar Notas -->
            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'notas'} ? 'active' : ''" href="/docente/gestionar-notas">
                    <i class="fas fa-edit"></i> Gestionar Notas
                </a>
            </li>

            <!-- Registrar Asistencia -->
            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'asistencia'} ? 'active' : ''" href="/docente/registrar-asistencia">
                    <i class="fas fa-clipboard-check"></i> Registrar Asistencia
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'reportes'} ? 'active' : ''" href="/docente/docentes-reportes">
                    <i class="fas fa-file-alt"></i> Reportes
                    <span class="badge bg-warning ms-1" style="color: #000;">PDF</span>
                </a>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
