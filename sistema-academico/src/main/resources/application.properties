spring.application.name=sistema-academico
server.port=8080

# ===== CONEXIÓN A BASE DE DATOS EN DOCKER =====
spring.datasource.url=jdbc:postgresql://localhost:5434/sistema_academico
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== CONFIGURACIÓN JPA - CREA TABLAS AUTOMÁTICAMENTE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# ===== CONFIGURACIÓN SEGURIDAD =====
spring.security.user.name=admin
spring.security.user.password=admin123

# ===== CONFIGURACIÓN SERVIDOR =====
server.error.include-message=always
server.error.include-binding-errors=always

# ===== LOGGING - VER QUÉ TABLAS SE CREAN =====
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm=INFO

# ===== EMAIL (usa variables de entorno) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== DIRECTORIO PARA VOUCHERS =====
voucher.upload.directory=uploads/vouchers

# ===== CONFIGURACIÓN DEL CHATBOT =====
chatbot.api.url=${CHATBOT_URL:http://localhost:8090/api/chat}

# ===== SPRING BOOT DEVTOOLS =====
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=400
spring.devtools.livereload.enabled=true