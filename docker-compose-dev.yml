services:
  chatbot-db:
    image: postgres:15-alpine
    container_name: chatbot-postgres-dev
    environment:
      - POSTGRES_DB=${CHATBOT_DB_NAME}
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - chatbot-db-data-dev:/var/lib/postgresql/data
    networks:
      - app-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  academico-db:
    image: postgres:15-alpine
    container_name: academico-postgres-dev
    environment:
      - POSTGRES_DB=${ACADEMICO_DB_NAME}
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - academico-db-data-dev:/var/lib/postgresql/data
    networks:
      - app-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  chatbot-db-data-dev:
  academico-db-data-dev:

networks:
  app-network-dev:
    driver: bridge