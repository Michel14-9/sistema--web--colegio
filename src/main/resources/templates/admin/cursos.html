<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Gestión de Cursos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/admin-navbar :: navbar}" th:with="tituloPagina='Gestión de Cursos'"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/admin-sidebar :: sidebar}" th:with="modulo='cursos'"></div>

        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div class="page-header">
                    <h1><i class="fas fa-book me-2 text-warning"></i> Gestión de Cursos</h1>
                    <p>Administra los cursos, edita o elimina información.</p>
                </div>
                <button type="button" class="btn-add" data-bs-toggle="modal" data-bs-target="#cursoModal" onclick="limpiarFormularioCurso()">
                    <i class="fas fa-plus me-2"></i>Nuevo Curso
                </button>
            </div>

            <!-- Tabla de cursos -->
            <div class="content-card">
                <div class="card-header-custom">
                    <div class="header-title">
                        <i class="fas fa-list"></i>
                        <h4>Lista de Cursos</h4>
                    </div>
                    <div class="header-count">
                        <span class="total-count" th:text="${#lists.size(cursos)}">0</span> cursos registrados
                    </div>
                </div>
                <div class="card-body-custom p-0">
                    <div class="table-responsive">
                        <table class="table table-modern">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Código</th>
                                <th>Nombre del Curso</th>
                                <th>Horas</th>
                                <th>Área</th>
                                <th>Docente</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="curso : ${cursos}">
                                <td th:text="${curso.idCurso}">-</td>
                                <td th:text="${curso.codigoCurso}">-</td>
                                <td th:text="${curso.nombreCurso}">-</td>
                                <td th:text="${curso.horasSemanales}">-</td>
                                <td th:text="${curso.area}">-</td>
                                <td th:text="${curso.docente != null ? curso.docente.nombres + ' ' + curso.docente.apellidoPaterno : 'No asignado'}">-</td>
                                <td>
                                    <span class="badge" th:class="${curso.estado == 'ACTIVO'} ? 'bg-success' : 'bg-danger'"
                                          th:text="${curso.estado}">-</span>
                                </td>
                                <td>
                                    <button type="button" class="btn-icon-edit"
                                            onclick="editarCurso(
                                                '${curso.idCurso}',
                                                '${curso.codigoCurso}',
                                                '${curso.nombreCurso}',
                                                '${curso.descripcion}',
                                                '${curso.horasSemanales}',
                                                '${curso.area}',
                                                '${curso.idGrado}',
                                                '${curso.idDocente}',
                                                '${curso.estado}'
                                            )" data-bs-toggle="modal" data-bs-target="#cursoModal">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button type="button" class="btn-icon-delete ms-1"
                                            onclick="confirmarEliminarCurso(${curso.idCurso}, '${curso.nombreCurso}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${cursos == null or cursos.empty}">
                                <td colspan="8" class="text-center py-4">
                                    <i class="fas fa-book fa-3x text-muted mb-2 d-block"></i>
                                    No hay cursos registrados
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL para Nuevo/Editar Curso -->
<div class="modal fade" id="cursoModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title">
                    <i class="fas fa-book me-2"></i>
                    <span id="modalTitulo">Nuevo Curso</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="cursoForm" method="post" th:action="@{/admin/curso/guardar}">
                <div class="modal-body">
                    <input type="hidden" id="cursoId" name="idCurso">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Código del Curso</label>
                            <input type="text" class="form-control" id="codigoCurso" name="codigoCurso"
                                   readonly style="background-color: #e9ecef;" placeholder="Se generará automáticamente">
                            <small class="text-muted">El código se genera automáticamente al guardar</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre del Curso *</label>
                            <input type="text" class="form-control" id="nombreCurso" name="nombreCurso" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="2"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Horas Semanales</label>
                            <input type="number" class="form-control" id="horasSemanales" name="horasSemanales">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Área</label>
                            <input type="text" class="form-control" id="area" name="area">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Grado</label>
                            <input type="number" class="form-control" id="idGrado" name="idGrado">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Docente Asignado</label>
                            <select class="form-select" id="idDocente" name="idDocente">
                                <option value="">Seleccionar docente...</option>
                                <option th:each="docente : ${docentes}" th:value="${docente.idDocente}"
                                        th:text="${docente.nombres + ' ' + docente.apellidoPaterno + ' ' + docente.apellidoMaterno}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Estado</label>
                            <select class="form-select" id="estado" name="estado">
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="INACTIVO">INACTIVO</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-warning">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/curso.js}"></script>
</body>
</html>
