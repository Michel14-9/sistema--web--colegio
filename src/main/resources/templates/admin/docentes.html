<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Gestión de Docentes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/admin-navbar :: navbar}" th:with="tituloPagina='Gestión de Docentes'"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/admin-sidebar :: sidebar}" th:with="modulo='docentes'"></div>

        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div class="page-header">
                    <h1><i class="fas fa-chalkboard-user me-2 text-success"></i> Gestión de Docentes</h1>
                    <p>Administra los docentes, edita o elimina información.</p>
                </div>
                <a href="/admin/docente/nuevo" class="btn-add">
                    <i class="fas fa-plus me-2"></i>Nuevo Docente
                </a>
            </div>

            <!-- Buscador -->
            <div class="search-card mb-4">
                <div class="row g-3">
                    <div class="col-md-6">
                        <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nombre, DNI o especialidad...">
                    </div>
                    <div class="col-md-3">
                        <select id="especialidadFilter" class="form-select">
                            <option value="">Todas las especialidades</option>
                            <option th:each="esp : ${especialidades}" th:value="${esp}" th:text="${esp}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="estadoFilter" class="form-select">
                            <option value="">Todos los estados</option>
                            <option value="ACTIVO">ACTIVO</option>
                            <option value="INACTIVO">INACTIVO</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tabla de docentes -->
            <div class="content-card">
                <div class="card-header-custom">
                    <div class="header-title">
                        <i class="fas fa-list"></i>
                        <h4>Lista de Docentes</h4>
                    </div>
                    <div class="header-count">
                        <span class="total-count" th:text="${#lists.size(docentes)}">0</span> docentes registrados
                    </div>
                </div>
                <div class="card-body-custom p-0">
                    <div class="table-responsive">
                        <table class="table table-modern" id="docentesTable">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Código</th>
                                <th>DNI</th>
                                <th>Nombres</th>
                                <th>Apellidos</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Especialidad</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="docente : ${docentes}">
                                <td th:text="${docente.idDocente}">-</td>
                                <td th:text="${docente.codigoDocente}">-</td>
                                <td th:text="${docente.dni}">-</td>
                                <td th:text="${docente.nombres}">-</td>
                                <td th:text="${docente.apellidoPaterno + ' ' + docente.apellidoMaterno}">-</td>
                                <td th:text="${docente.email}">-</td>
                                <td th:text="${docente.celular}">-</td>
                                <td><span class="badge-specialty" th:text="${docente.especialidad}">-</span></td>
                                <td>
                                    <span class="badge" th:class="${docente.estado == 'ACTIVO'} ? 'bg-success' : 'bg-danger'"
                                          th:text="${docente.estado}">-</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/docente/editar/{id}(id=${docente.idDocente})}" class="btn-icon-edit">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <button type="button" class="btn-icon-delete ms-1"
                                            onclick="confirmarEliminarDocente(${docente.idDocente}, '${docente.nombres}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${docentes == null or docentes.empty}">
                                <td colspan="10" class="text-center py-4">
                                    <i class="fas fa-chalkboard-user fa-3x text-muted mb-2 d-block"></i>
                                    No hay docentes registrados
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function confirmarEliminarDocente(id, nombre) {
        if (confirm(`¿Está seguro de eliminar al docente "${nombre}"?`)) {
            window.location.href = `/admin/docente/eliminar/${id}`;
        }
    }

    // Filtros en tiempo real
    document.getElementById('searchInput')?.addEventListener('keyup', function() {
        let filter = this.value.toLowerCase();
        let rows = document.querySelectorAll('#docentesTable tbody tr');
        rows.forEach(row => {
            let text = row.innerText.toLowerCase();
            row.style.display = text.includes(filter) ? '' : 'none';
        });
    });
</script>
</body>
</html>
