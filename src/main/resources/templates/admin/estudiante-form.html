<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Editar Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/admin-navbar :: navbar}" th:with="tituloPagina='Editar Estudiante'"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/admin-sidebar :: sidebar}" th:with="modulo='estudiantes'"></div>

        <div class="col-md-10 col-lg-10 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div class="page-header">
                    <h1><i class="fas fa-user-graduate me-2 text-primary"></i> Editar Estudiante</h1>
                    <p>Modifica los datos del estudiante</p>
                </div>
                <a th:href="@{/admin/estudiantes}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Volver
                </a>
            </div>

            <div class="content-card">
                <div class="card-body-custom">
                    <form th:action="@{/admin/estudiante/actualizar/{id}(id=${estudiante.idEstudiante})}"
                          th:object="${estudiante}" method="post">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Código</label>
                                <input type="text" class="form-control" th:field="*{codigoEstudiante}" readonly>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">DNI</label>
                                <input type="text" class="form-control" th:field="*{dni}" readonly>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Nombres</label>
                                <input type="text" class="form-control" th:field="*{nombres}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Apellido Paterno</label>
                                <input type="text" class="form-control" th:field="*{apellidoPaterno}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Apellido Materno</label>
                                <input type="text" class="form-control" th:field="*{apellidoMaterno}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email Institucional</label>
                                <input type="email" class="form-control" th:field="*{emailInstitucional}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Celular</label>
                                <input type="tel" class="form-control" th:field="*{celular}" maxlength="9">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Género</label>
                                <select class="form-select" th:field="*{genero}">
                                    <option value="M">Masculino</option>
                                    <option value="F">Femenino</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Grado</label>
                                <select class="form-select" th:field="*{idGrado}">
                                    <option value="1">1° Primaria</option>
                                    <option value="2">2° Primaria</option>
                                    <option value="3">3° Primaria</option>
                                    <option value="4">4° Primaria</option>
                                    <option value="5">5° Primaria</option>
                                    <option value="6">6° Primaria</option>
                                    <option value="7">1° Secundaria</option>
                                    <option value="8">2° Secundaria</option>
                                    <option value="9">3° Secundaria</option>
                                    <option value="10">4° Secundaria</option>
                                    <option value="11">5° Secundaria</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Sección</label>
                                <select class="form-select" th:field="*{seccion}">
                                    <option value="">Seleccionar</option>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>
                                    <option value="D">D</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Turno</label>
                                <select class="form-select" th:field="*{turno}">
                                    <option value="">Seleccionar</option>
                                    <option value="MAÑANA">Mañana</option>
                                    <option value="TARDE">Tarde</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Estado</label>
                                <select class="form-select" th:field="*{estado}">
                                    <option value="ACTIVO">ACTIVO</option>
                                    <option value="INACTIVO">INACTIVO</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                                <a th:href="@{/admin/estudiantes}" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
