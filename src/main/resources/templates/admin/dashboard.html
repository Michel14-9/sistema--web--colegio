<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Administrador</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- CSS Admin -->
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

<!-- Header / Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/dashboard">
            <i class="fas fa-user-shield me-2"></i>
            Sistema Académico - Admin
        </a>
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="fas fa-user-circle me-1"></i>
                <span th:text="${#authentication.name}"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="dropdown-item" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer;">
                            <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 col-lg-2 d-md-block sidebar p-0">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/dashboard">
                            <i class="fas fa-tachometer-alt me-2"></i>
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/estudiantes">
                            <i class="fas fa-user-graduate me-2"></i>
                            Estudiantes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/docentes">
                            <i class="fas fa-chalkboard-teacher me-2"></i>
                            Docentes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/cursos">
                            <i class="fas fa-book me-2"></i>
                            Cursos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/matriculas">
                            <i class="fas fa-clipboard-check me-2"></i>
                            Matrículas
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 ms-sm-auto px-4 py-3">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="fas fa-tachometer-alt me-2 text-primary"></i>
                    Panel de Administración
                </h1>
            </div>

            <!-- Tarjetas de estadísticas -->
            <div class="row mb-4">
                <div class="col-md-6 col-lg-3 mb-3">
                    <div class="card stat-card bg-primary text-white h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="card-title text-white-50">Total Estudiantes</h6>
                                    <h2 class="mb-0" th:text="${totalEstudiantes}">0</h2>
                                </div>
                                <i class="fas fa-user-graduate fa-3x text-white-50"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3 mb-3">
                    <div class="card stat-card bg-success text-white h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="card-title text-white-50">Total Docentes</h6>
                                    <h2 class="mb-0" th:text="${totalDocentes}">0</h2>
                                </div>
                                <i class="fas fa-chalkboard-teacher fa-3x text-white-50"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3 mb-3">
                    <div class="card stat-card bg-warning text-white h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="card-title text-white-50">Total Cursos</h6>
                                    <h2 class="mb-0" th:text="${totalCursos}">0</h2>
                                </div>
                                <i class="fas fa-book fa-3x text-white-50"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3 mb-3">
                    <div class="card stat-card bg-info text-white h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="card-title text-white-50">Matrículas Activas</h6>
                                    <h2 class="mb-0" th:text="${totalMatriculas}">0</h2>
                                </div>
                                <i class="fas fa-clipboard-check fa-3x text-white-50"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de últimas actividades -->
            <div class="card mt-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0">
                        <i class="fas fa-history me-2 text-primary"></i>
                        Últimas Actividades
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Fecha</th>
                                <th>Usuario</th>
                                <th>Acción</th>
                                <th>Detalles</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="actividad : ${ultimasActividades}">
                                <td th:text="${#temporals.format(actividad.fecha, 'dd/MM/yyyy HH:mm:ss')}">-</td>
                                <td th:text="${actividad.usuario}">-</td>
                                <td>
                            <span th:switch="${actividad.accion}" class="badge">
                                <span th:case="'LOGIN'" class="bg-success" th:text="${actividad.accion}"></span>
                                <span th:case="'CREAR'" class="bg-primary" th:text="${actividad.accion}"></span>
                                <span th:case="'EDITAR'" class="bg-warning" th:text="${actividad.accion}"></span>
                                <span th:case="'ELIMINAR'" class="bg-danger" th:text="${actividad.accion}"></span>
                                <span th:case="*" class="bg-secondary" th:text="${actividad.accion}"></span>
                            </span>
                                </td>
                                <td th:text="${actividad.detalle}">-</td>
                            </tr>
                            <tr th:if="${ultimasActividades == null or ultimasActividades.empty}">
                                <td colspan="4" class="text-center py-4">
                                    <i class="fas fa-history fa-3x text-muted mb-2 d-block"></i>
                                    No hay actividades recientes
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
