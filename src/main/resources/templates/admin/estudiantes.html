<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Gestión de Estudiantes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/admin-navbar :: navbar}" th:with="tituloPagina='Gestión de Estudiantes'"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/admin-sidebar :: sidebar}" th:with="modulo='estudiantes'"></div>

        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div class="page-header">
                    <h1><i class="fas fa-user-graduate me-2 text-primary"></i> Gestión de Estudiantes</h1>
                    <p>Administra los estudiantes, edita o elimina información.</p>
                </div>
                <a href="/admin/estudiante/nuevo" class="btn-add">
                    <i class="fas fa-plus me-2"></i>Nuevo Estudiante
                </a>
            </div>

            <!-- Buscador y filtros -->
            <div class="search-card mb-4">
                <div class="row g-3">
                    <div class="col-md-6">
                        <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nombre, DNI o apellido...">
                    </div>
                    <div class="col-md-3">
                        <select id="estadoFilter" class="form-select">
                            <option value="">Todos los estados</option>
                            <option value="ACTIVO">ACTIVO</option>
                            <option value="INACTIVO">INACTIVO</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="gradoFilter" class="form-select">
                            <option value="">Todos los grados</option>
                            <option value="1">1° Primaria</option>
                            <option value="2">2° Primaria</option>
                            <option value="3">3° Primaria</option>
                            <option value="4">4° Primaria</option>
                            <option value="5">5° Primaria</option>
                            <option value="6">6° Primaria</option>
                            <option value="7">1° Secundaria</option>
                            <option value="8">2° Secundaria</option>
                            <option value="9">3° Secundaria</option>
                            <option value="10">4° Secundaria</option>
                            <option value="11">5° Secundaria</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tabla de estudiantes -->
            <div class="content-card">
                <div class="card-header-custom">
                    <div class="header-title">
                        <i class="fas fa-list"></i>
                        <h4>Lista de Estudiantes</h4>
                    </div>
                    <div class="header-count">
                        <span class="total-count" th:text="${#lists.size(estudiantes)}">0</span> estudiantes registrados
                    </div>
                </div>
                <div class="card-body-custom p-0">
                    <div class="table-responsive">
                        <table class="table table-modern" id="estudiantesTable">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Código</th>
                                <th>DNI</th>
                                <th>Nombres</th>
                                <th>Apellidos</th>
                                <th>Email</th>
                                <th>Grado</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="estudiante : ${estudiantes}">
                                <td th:text="${estudiante.idEstudiante}">-</td>
                                <td th:text="${estudiante.codigoEstudiante}">-</td>
                                <td th:text="${estudiante.dni}">-</td>
                                <td th:text="${estudiante.nombres}">-</td>
                                <td th:text="${estudiante.apellidoPaterno + ' ' + estudiante.apellidoMaterno}">-</td>
                                <td th:text="${estudiante.emailInstitucional}">-</td>
                                <td th:text="${estudiante.idGrado}">-</td>
                                <td>
                                    <span class="badge" th:class="${estudiante.estado == 'ACTIVO'} ? 'bg-success' : 'bg-danger'"
                                          th:text="${estudiante.estado}">-</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/estudiante/editar/{id}(id=${estudiante.idEstudiante})}" class="btn-icon-edit">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <button type="button" class="btn-icon-delete ms-1"
                                            onclick="confirmarEliminarEstudiante(${estudiante.idEstudiante}, '${estudiante.nombres}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${estudiantes == null or estudiantes.empty}">
                                <td colspan="9" class="text-center py-4">
                                    <i class="fas fa-user-graduate fa-3x text-muted mb-2 d-block"></i>
                                    No hay estudiantes registrados
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function confirmarEliminarEstudiante(id, nombre) {
        if (confirm(`¿Está seguro de eliminar al estudiante "${nombre}"?`)) {
            window.location.href = `/admin/estudiante/eliminar/${id}`;
        }
    }

    // Filtro de búsqueda en tiempo real
    document.getElementById('searchInput')?.addEventListener('keyup', function() {
        let filter = this.value.toLowerCase();
        let rows = document.querySelectorAll('#estudiantesTable tbody tr');
        rows.forEach(row => {
            if (row.cells && row.cells.length > 0) {
                let text = row.innerText.toLowerCase();
                row.style.display = text.includes(filter) ? '' : 'none';
            }
        });
    });

    // Filtro por estado
    document.getElementById('estadoFilter')?.addEventListener('change', function() {
        let estado = this.value.toLowerCase();
        let rows = document.querySelectorAll('#estudiantesTable tbody tr');
        rows.forEach(row => {
            if (row.cells && row.cells.length > 0) {
                let estadoCelda = row.cells[7]?.innerText.toLowerCase() || '';
                if (estado === '' || estadoCelda === estado) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            }
        });
    });

    // Filtro por grado
    document.getElementById('gradoFilter')?.addEventListener('change', function() {
        let grado = this.value.toLowerCase();
        let rows = document.querySelectorAll('#estudiantesTable tbody tr');
        rows.forEach(row => {
            if (row.cells && row.cells.length > 0) {
                let gradoCelda = row.cells[6]?.innerText.toLowerCase() || '';
                if (grado === '' || gradoCelda === grado) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            }
        });
    });
</script>
</body>
</html>
