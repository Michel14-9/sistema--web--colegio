<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div class="col-md-2 col-lg-2 d-md-block sidebar p-0" th:fragment="sidebar">
    <div class="sidebar-menu">
        <div class="user-info text-center">
            <div class="user-avatar">
                <img th:src="@{/img/logo.png}" alt="Logo" class="avatar-img">
            </div>
            <h5 th:text="${estudiante.nombres} + ' ' + ${estudiante.apellidoPaterno}"></h5>
            <p><i class="fas fa-id-card"></i> <span th:text="${estudiante.dni}">-</span></p>
            <p><i class="fas fa-envelope"></i> <span th:text="${estudiante.emailInstitucional}">-</span></p>
            <p><i class="fas fa-graduation-cap"></i> Grado: <span th:text="${nombreGradoActual}">-</span></p>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'dashboard'} ? 'active' : ''" href="/estudiante/dashboard">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'mis-cursos'} ? 'active' : ''" href="/estudiante/cursos">
                    <i class="fas fa-book-open"></i> Mis Cursos
                    <span class="badge bg-success ms-1" th:text="${totalCursosInscritos}">0</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'mi-horario'} ? 'active' : ''" href="/estudiante/horario">
                    <i class="fas fa-calendar-alt"></i> Mi Horario
                </a>
            </li>
            <!-- Evaluación -->
            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'mis-notas'} ? 'active' : ''" href="/estudiante/notas">
                    <i class="fas fa-star"></i> Mis Notas
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'mi-asistencia'} ? 'active' : ''" href="/estudiante/asistencia">
                    <i class="fas fa-clipboard-check"></i> Asistencia
                </a>
            </li>


            <li class="nav-item">
                <a class="nav-link" th:classappend="${modulo == 'mi-matricula'} ? 'active' : ''" href="/estudiante/matricula">
                    <i class="fas fa-file-signature"></i> Mi Matrícula
                </a>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
