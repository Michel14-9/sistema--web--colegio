<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Panel del Docente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/docente.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/docente-navbar :: navbar}">
    <div th:with="tituloPagina='Dashboard'"></div>
</div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/docente-sidebar :: sidebar}">
            <div th:with="modulo='dashboard'"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 main-content">
            <div class="welcome-hero">
                <div class="welcome-text">
                    <h1>¡Bienvenido, <span th:text="${docente.nombres}"></span>!</h1>
                    <p>Gestiona tus cursos, estudiantes y calificaciones desde este panel.</p>
                </div>
                <div class="welcome-date">
                    <i class="fas fa-calendar-day"></i>
                    <span id="currentDate"></span>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-chalkboard"></i></div>
                    <div class="stat-info">
                        <h3 th:text="${totalCursos}">0</h3>
                        <p>Cursos Asignados</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-users"></i></div>
                    <div class="stat-info">
                        <h3 th:text="${totalEstudiantes}">0</h3>
                        <p>Total Estudiantes</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-graduation-cap"></i></div>
                    <div class="stat-info">
                        <h5 th:text="${docente.especialidad}">-</h5>
                        <p>Especialidad</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-clock"></i></div>
                    <div class="stat-info">
                        <h3>24/7</h3>
                        <p>Disponibilidad</p>
                    </div>
                </div>
            </div>

            <!-- Mis Cursos -->
            <div class="content-card">
                <div class="card-header-custom">
                    <div class="header-title">
                        <i class="fas fa-chalkboard-user"></i>
                        <h4>Mis Cursos Asignados</h4>
                    </div>
                    <a href="/docente/mis-cursos" class="btn-view-all">Ver todos <i class="fas fa-arrow-right"></i></a>
                </div>
                <div class="card-body-custom">
                    <div th:if="${cursos != null and !cursos.empty}">
                        <div class="courses-grid">
                            <div class="course-item" th:each="curso : ${cursos}">
                                <div class="course-icon"><i class="fas fa-book"></i></div>
                                <div class="course-info">
                                    <h5 th:text="${curso.nombreCurso}">-</h5>
                                    <p>Código: <span th:text="${curso.codigoCurso}">-</span></p>
                                    <span class="course-status" th:class="${curso.estado == 'ACTIVO'} ? 'status-active' : 'status-inactive'"
                                          th:text="${curso.estado}">-</span>
                                </div>
                                <a th:href="@{/docente/curso/{id}/estudiantes(id=${curso.idCurso})}" class="btn-course">
                                    <i class="fas fa-users"></i> Ver Estudiantes
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="empty-state" th:unless="${cursos != null and !cursos.empty}">
                        <i class="fas fa-book-open"></i>
                        <h4>No tienes cursos asignados</h4>
                        <p>Contacta con el administrador.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('es-PE', options);
</script>
</body>
</html>
