<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Docente</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- CSS Docente -->
    <link th:href="@{/css/docente.css}" rel="stylesheet">
</head>
<body>

<!-- Header / Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/docente/dashboard">
            <i class="fas fa-chalkboard-teacher me-2"></i>
            Sistema Académico - Docente
        </a>
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="fas fa-user-circle me-1"></i>
                <span th:text="${docente.nombres}"></span>
                <span th:text="${docente.apellidos}"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="/logout">
                    <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                </a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 col-lg-2 d-md-block sidebar p-0">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="/docente/dashboard">
                            <i class="fas fa-tachometer-alt me-2"></i>
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/docente/mis-cursos">
                            <i class="fas fa-book me-2"></i>
                            Mis Cursos
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 ms-sm-auto px-4 py-3">
            <!-- Bienvenida -->
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="fas fa-tachometer-alt me-2 text-success"></i>
                    Dashboard
                </h1>
            </div>

            <!-- Tarjetas de estadísticas (datos dinámicos) -->
            <div class="row mb-4">
                <div class="col-md-6 col-lg-4 mb-3">
                    <div class="card stat-card bg-success text-white h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="card-title text-white-50">Mis Cursos</h6>
                                    <h2 class="mb-0" th:text="${totalCursos}">0</h2>
                                </div>
                                <i class="fas fa-book fa-3x text-white-50"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4 mb-3">
                    <div class="card stat-card bg-primary text-white h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="card-title text-white-50">Total Estudiantes</h6>
                                    <h2 class="mb-0" th:text="${totalEstudiantes}">0</h2>
                                </div>
                                <i class="fas fa-users fa-3x text-white-50"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4 mb-3">
                    <div class="card stat-card bg-info text-white h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="card-title text-white-50">Especialidad</h6>
                                    <h5 class="mb-0" th:text="${docente.especialidad}">-</h5>
                                </div>
                                <i class="fas fa-graduation-cap fa-3x text-white-50"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lista de cursos asignados (datos dinámicos) -->
            <div class="card mt-4">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">
                        <i class="fas fa-chalkboard me-2 text-success"></i>
                        Mis Cursos Asignados
                    </h5>
                    <a href="/docente/mis-cursos" class="btn btn-sm btn-outline-success">
                        Ver todos <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Código</th>
                                <th>Curso</th>
                                <th>Créditos</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="curso : ${cursos}">
                                <td th:text="${curso.codigoInterno}">-</td>
                                <td th:text="${curso.nombreCurso}">-</td>
                                <td th:text="${curso.creditos}">-</td>
                                <td>
                                            <span class="badge" th:class="${curso.estado == 'ACTIVO'} ? 'badge-success' : 'badge-secondary'"
                                                  th:text="${curso.estado}">-</span>
                                </td>
                                <td>
                                    <a th:href="@{/docente/curso/{id}/estudiantes(id=${curso.cursoId})}"
                                       class="btn btn-sm btn-success">
                                        <i class="fas fa-users"></i> Ver Estudiantes
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${cursos == null or cursos.empty}">
                                <td colspan="5" class="text-center py-4">
                                    <i class="fas fa-book-open fa-3x text-muted mb-2 d-block"></i>
                                    No tienes cursos asignados aún
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
