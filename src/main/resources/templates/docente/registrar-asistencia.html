<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Registrar Asistencia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/docente.css}" rel="stylesheet">
    <style>
        .asistencia-select {
            min-width: 120px;
        }
        .asistencia-presente { background-color: #d4edda !important; }
        .asistencia-ausente { background-color: #f8d7da !important; }
        .asistencia-tardanza { background-color: #fff3cd !important; }
        .asistencia-justificado { background-color: #d1ecf1 !important; }
    </style>
</head>
<body>

<div th:replace="~{fragments/docente-navbar :: navbar}">
    <div th:with="tituloPagina='Registrar Asistencia'"></div>
</div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/docente-sidebar :: sidebar}">
            <div th:with="modulo='asistencia'"></div>
        </div>

        <div class="col-md-10 col-lg-10 main-content">
            <div class="page-header">
                <h1><i class="fas fa-clipboard-check"></i> Registrar Asistencia</h1>
                <p>Registra la asistencia diaria de tus estudiantes por curso.</p>
            </div>

            <!-- ALERTAS -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <div class="d-flex align-items-center">
                    <div class="me-3"><i class="fas fa-check-circle fa-2x"></i></div>
                    <div><strong>¡Éxito!</strong><br><span th:text="${success}"></span></div>
                    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
                </div>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <div class="d-flex align-items-center">
                    <div class="me-3"><i class="fas fa-exclamation-circle fa-2x"></i></div>
                    <div><strong>¡Error!</strong><br><span th:text="${error}"></span></div>
                    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
                </div>
            </div>

            <!-- Filtros -->
            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Curso</label>
                            <select class="form-select" id="selectCurso" onchange="cargarAsistencia()">
                                <option value="">Seleccionar curso...</option>
                                <option th:each="curso : ${cursos}"
                                        th:value="${curso.idCurso}"
                                        th:selected="${cursoSeleccionado != null and cursoSeleccionado.idCurso == curso.idCurso}"
                                        th:text="${curso.nombreCurso} + ' (' + ${curso.codigoCurso} + ')'">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Fecha</label>
                            <input type="date" class="form-control" id="fechaAsistencia"
                                   th:value="${fechaSeleccionada}"
                                   onchange="cargarAsistencia()">
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button class="btn btn-primary" onclick="cargarAsistencia()">
                                <i class="fas fa-sync"></i> Cargar
                            </button>
                            <button class="btn btn-success ms-2" onclick="marcarTodosPresentes()">
                                <i class="fas fa-check-double"></i> Todos Presentes
                            </button>
                        </div>
                        <div class="col-md-2 d-flex align-items-end justify-content-end">
                            <span class="badge bg-info fs-6 p-2" th:if="${cursoSeleccionado != null}">
                                <i class="fas fa-users"></i> <span th:text="${#lists.size(estudiantes)}"></span> alumnos
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de Asistencia -->
            <div th:if="${cursoSeleccionado != null}">
                <form id="formAsistencia" method="post" th:action="@{/docente/asistencia/guardar}">
                    <input type="hidden" name="idCurso" th:value="${cursoSeleccionado.idCurso}">
                    <input type="hidden" name="fecha" th:value="${fechaSeleccionada}">

                    <div class="content-card">
                        <div class="card-header-custom">
                            <div class="header-title">
                                <i class="fas fa-clipboard-list"></i>
                                <h4>Asistencia del <span th:text="${fechaSeleccionada}"></span></h4>
                            </div>
                            <button type="submit" class="btn btn-success btn-sm">
                                <i class="fas fa-save"></i> Guardar Asistencia
                            </button>
                        </div>
                        <div class="card-body-custom p-0">
                            <div class="table-responsive">
                                <table class="table table-modern">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Estudiante</th>
                                        <th>Estado</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="estudiante, iterStat : ${estudiantes}">
                                        <td th:text="${iterStat.count}">1</td>
                                        <td th:text="${estudiante.nombres} + ' ' + ${estudiante.apellidoPaterno} + ' ' + ${estudiante.apellidoMaterno}">-</td>
                                        <td>
                                            <!-- CORREGIDO: Usar th:name en lugar de name fijo -->
                                            <select class="form-select asistencia-select"
                                                    th:name="'asistencia_' + ${estudiante.idEstudiante}"
                                                    th:attr="data-id=${estudiante.idEstudiante}"
                                                    onchange="cambiarColor(this)">
                                                <option value="PRESENTE"
                                                        th:selected="${asistenciasExistentes.containsKey(estudiante.idEstudiante) and asistenciasExistentes.get(estudiante.idEstudiante) == 'PRESENTE'}">
                                                    ✅ PRESENTE
                                                </option>
                                                <option value="AUSENTE"
                                                        th:selected="${asistenciasExistentes.containsKey(estudiante.idEstudiante) and asistenciasExistentes.get(estudiante.idEstudiante) == 'AUSENTE'}">
                                                    ❌ AUSENTE
                                                </option>
                                                <option value="TARDANZA"
                                                        th:selected="${asistenciasExistentes.containsKey(estudiante.idEstudiante) and asistenciasExistentes.get(estudiante.idEstudiante) == 'TARDANZA'}">
                                                    ⏰ TARDANZA
                                                </option>
                                                <option value="JUSTIFICADO"
                                                        th:selected="${asistenciasExistentes.containsKey(estudiante.idEstudiante) and asistenciasExistentes.get(estudiante.idEstudiante) == 'JUSTIFICADO'}">
                                                    📝 JUSTIFICADO
                                                </option>
                                            </select>
                                        </td>
                                    </tr>
                                    <tr th:if="${estudiantes == null or estudiantes.empty}">
                                        <td colspan="3" class="text-center py-4">
                                            <i class="fas fa-users fa-2x text-muted mb-2 d-block"></i>
                                            No hay estudiantes matriculados en este curso.
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div th:unless="${cursoSeleccionado != null}" class="empty-state">
                <i class="fas fa-hand-pointer"></i>
                <h4>Selecciona un curso</h4>
                <p>Elige un curso y fecha para registrar la asistencia.</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function cargarAsistencia() {
        var cursoId = document.getElementById('selectCurso').value;
        var fecha = document.getElementById('fechaAsistencia').value;
        var url = '/docente/registrar-asistencia?';

        if (cursoId) {
            url += 'idCurso=' + cursoId;
        }
        if (fecha) {
            url += '&fecha=' + fecha;
        }

        window.location.href = url;
    }

    function cambiarColor(select) {
        var row = select.closest('tr');
        row.classList.remove('asistencia-presente', 'asistencia-ausente', 'asistencia-tardanza', 'asistencia-justificado');

        var valor = select.value;
        if (valor === 'PRESENTE') {
            row.classList.add('asistencia-presente');
        } else if (valor === 'AUSENTE') {
            row.classList.add('asistencia-ausente');
        } else if (valor === 'TARDANZA') {
            row.classList.add('asistencia-tardanza');
        } else if (valor === 'JUSTIFICADO') {
            row.classList.add('asistencia-justificado');
        }
    }

    function marcarTodosPresentes() {
        var selects = document.querySelectorAll('select[name^="asistencia_"]');
        selects.forEach(function(select) {
            select.value = 'PRESENTE';
            cambiarColor(select);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        var selects = document.querySelectorAll('select[name^="asistencia_"]');
        selects.forEach(function(select) {
            cambiarColor(select);
        });
    });
</script>
</body>
</html>
