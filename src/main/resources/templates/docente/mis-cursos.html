<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Mis Cursos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/docente.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/docente-navbar :: navbar}">
    <div th:with="tituloPagina='Mis Cursos'"></div>
</div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/docente-sidebar :: sidebar}">
            <div th:with="modulo='cursos'"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 main-content">
            <div class="page-header">
                <h1><i class="fas fa-book-open"></i> Mis Cursos Asignados</h1>
                <p>Aquí encontrarás todos los cursos que tienes asignados.</p>
            </div>

            <div class="courses-container">
                <div class="row g-4">
                    <div class="col-md-6 col-lg-4" th:each="curso : ${cursos}">
                        <div class="course-card-modern">
                            <div class="course-card-icon">
                                <i class="fas fa-chalkboard-user"></i>
                            </div>
                            <div class="course-card-body">
                                <h4 th:text="${curso.nombreCurso}">-</h4>
                                <p><i class="fas fa-code"></i> Código: <span th:text="${curso.codigoCurso}">-</span></p>
                                <p><i class="fas fa-calendar-alt"></i> Estado:
                                    <span class="badge" th:class="${curso.estado == 'ACTIVO'} ? 'badge-success' : 'badge-secondary'"
                                          th:text="${curso.estado}">-</span>
                                </p>
                                <a th:href="@{/docente/curso/{id}/estudiantes(id=${curso.idCurso})}" class="btn-view-students">
                                    <i class="fas fa-users"></i> Ver Estudiantes
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="col-12" th:unless="${cursos != null and !cursos.empty}">
                        <div class="empty-state-large">
                            <i class="fas fa-book-open"></i>
                            <h3>No tienes cursos asignados</h3>
                            <p>Contacta con el administrador para que te asignen cursos.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
