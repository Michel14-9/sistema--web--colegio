<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Cursos - Docente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link th:href="@{/css/docente.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/docente/dashboard">
            <i class="fas fa-chalkboard-teacher me-2"></i>
            Sistema Académico - Docente
        </a>
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="fas fa-user-circle me-1"></i>

                <span th:text="${docente.nombres}"></span>
                <span th:text="${docente.apellidoPaterno}"></span>
                <span th:text="${docente.apellidoMaterno}"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">

                <li>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="dropdown-item" style="background: none; border: none; width: 100%; text-align: left;">
                            <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 col-lg-2 d-md-block sidebar p-0">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/docente/dashboard">
                            <i class="fas fa-tachometer-alt me-2"></i>
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/docente/mis-cursos">
                            <i class="fas fa-book me-2"></i>
                            Mis Cursos
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-md-10 col-lg-10 ms-sm-auto px-4 py-3">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="fas fa-book me-2 text-success"></i>
                    Mis Cursos Asignados
                </h1>
            </div>

            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card stat-card bg-success text-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="card-title">Total de Cursos</h6>
                                    <h3 class="mb-0" th:text="${totalCursos}">0</h3>
                                </div>
                                <i class="fas fa-chalkboard fa-3x"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card bg-primary text-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="card-title">Cursos Activos</h6>
                                    <h3 class="mb-0" th:text="${cursosActivos}">0</h3>
                                </div>
                                <i class="fas fa-play-circle fa-3x"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card bg-info text-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="card-title">Cursos Inactivos</h6>
                                    <h3 class="mb-0" th:text="${cursosInactivos}">0</h3>
                                </div>
                                <i class="fas fa-pause-circle fa-3x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div th:each="curso : ${cursos}" class="col-md-6 col-lg-4 mb-4">
                    <div class="card curso-card h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <span class="badge" th:class="${curso.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${curso.estado}">-</span>
                                <i class="fas fa-graduation-cap fa-2x text-success"></i>
                            </div>
                            <h5 class="card-title" th:text="${curso.nombreCurso}">-</h5>
                            <p class="card-text" th:text="${curso.descripcion}">Sin descripción</p>
                            <hr>
                            <div class="mb-2">
                                <small class="text-muted">
                                    <i class="fas fa-hashtag me-1"></i> Código:

                                    <strong th:text="${curso.codigoCurso}">-</strong>
                                </small>
                            </div>
                            <div class="mb-2">
                                <small class="text-muted">
                                    <i class="fas fa-clock me-1"></i> Horas Semanales:
                                    <strong th:text="${curso.horasSemanales}">0</strong>
                                </small>
                            </div>
                            <div class="mb-2">
                                <small class="text-muted">
                                    <i class="fas fa-layer-group me-1"></i> Área:
                                    <strong th:text="${curso.area}">-</strong>
                                </small>
                            </div>
                            <div class="mb-3">
                                <small class="text-muted">
                                    <i class="fas fa-users me-1"></i> Grado:
                                    <strong th:text="${curso.idGrado}">-</strong>
                                </small>
                            </div>

                            <a th:href="@{/docente/curso/{id}/estudiantes(id=${curso.idCurso})}"
                               class="btn btn-success w-100">
                                <i class="fas fa-users me-2"></i>Ver Estudiantes
                            </a>
                        </div>
                    </div>
                </div>

                <div th:if="${cursos == null or cursos.empty}" class="col-12">
                    <div class="empty-state">
                        <i class="fas fa-book-open"></i>
                        <h4>No tienes cursos asignados</h4>
                        <p>Actualmente no estás asignado a ningún curso.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/docente.js}"></script>
</body>
</html>
