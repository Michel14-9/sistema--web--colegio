<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Mis Cursos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/docente.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" href="/docente/dashboard">
            <div class="brand-icon">
                <img th:src="@{/img/logo.png}" alt="Logo" class="nav-logo">
            </div>
            <div class="brand-text">
                <h3>I.E. SAN CARLOS</h3>
                <p>Mis Cursos</p>
            </div>
        </a>
        <div class="dropdown">
            <button class="dropdown-toggle-btn" type="button" data-bs-toggle="dropdown">
                <i class="fas fa-user-circle"></i>
                <span class="user-name" th:text="${docente.nombres}"></span>
                <i class="fas fa-chevron-down"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 col-lg-2 d-md-block sidebar p-0">
            <div class="sidebar-menu">
                <div class="user-info text-center">
                    <div class="user-avatar"><img th:src="@{/img/logo.png}" alt="Logo" class="avatar-img"></div>
                    <h5 th:text="${docente.nombres} + ' ' + ${docente.apellidoPaterno}"></h5>
                    <p><i class="fas fa-id-card"></i> <span th:text="${docente.dni}">-</span></p>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="/docente/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/docente/mis-cursos"><i class="fas fa-book-open"></i> Mis Cursos</a></li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 main-content">
            <div class="page-header">
                <h1><i class="fas fa-book-open"></i> Mis Cursos Asignados</h1>
                <p>Aquí encontrarás todos los cursos que tienes asignados.</p>
            </div>

            <div class="courses-container">
                <div class="row g-4">
                    <div class="col-md-6 col-lg-4" th:each="curso : ${cursos}">
                        <div class="course-card-modern">
                            <div class="course-card-icon">
                                <i class="fas fa-chalkboard-user"></i>
                            </div>
                            <div class="course-card-body">
                                <h4 th:text="${curso.nombreCurso}">-</h4>
                                <p><i class="fas fa-code"></i> Código: <span th:text="${curso.codigoCurso}">-</span></p>
                                <p><i class="fas fa-calendar-alt"></i> Estado:
                                    <span class="badge" th:class="${curso.estado == 'ACTIVO'} ? 'badge-success' : 'badge-secondary'"
                                          th:text="${curso.estado}">-</span>
                                </p>
                                <a th:href="@{/docente/curso/{id}/estudiantes(id=${curso.idCurso})}" class="btn-view-students">
                                    <i class="fas fa-users"></i> Ver Estudiantes
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="col-12" th:unless="${cursos != null and !cursos.empty}">
                        <div class="empty-state-large">
                            <i class="fas fa-book-open"></i>
                            <h3>No tienes cursos asignados</h3>
                            <p>Contacta con el administrador para que te asignen cursos.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
