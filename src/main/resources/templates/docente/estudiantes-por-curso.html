<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Estudiantes del Curso</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/docente.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/docente-navbar :: navbar}">
    <div th:with="tituloPagina=${'Curso: ' + curso.nombreCurso}"></div>
</div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/docente-sidebar :: sidebar}">
            <div th:with="modulo='cursos'"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 main-content">
            <div class="curso-header">
                <div class="curso-header-icon">
                    <i class="fas fa-chalkboard-user"></i>
                </div>
                <div class="curso-header-info">
                    <h1 th:text="${curso.nombreCurso}">-</h1>
                    <p><strong>Código:</strong> <span th:text="${curso.codigoCurso}">-</span> |
                        <strong>Estado:</strong> <span class="badge" th:class="${curso.estado == 'ACTIVO'} ? 'badge-success' : 'badge-secondary'" th:text="${curso.estado}">-</span></p>
                </div>
                <a href="/docente/mis-cursos" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Volver a Mis Cursos
                </a>
            </div>

            <div class="content-card">
                <div class="card-header-custom">
                    <div class="header-title">
                        <i class="fas fa-users"></i>
                        <h4>Estudiantes Matriculados</h4>
                    </div>
                    <div class="header-count">
                        <span class="total-count" th:text="${#lists.size(estudiantes)}">0</span> estudiantes
                    </div>
                </div>
                <div class="card-body-custom p-0">
                    <div class="table-responsive">
                        <table class="table table-modern">
                            <thead>
                            <tr><th><i class="fas fa-hashtag"></i> #</th><th><i class="fas fa-id-card"></i> DNI</th><th><i class="fas fa-user-graduate"></i> Apellidos y Nombres</th><th><i class="fas fa-envelope"></i> Email</th><th><i class="fas fa-calendar-alt"></i> Estado</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="estudiante, iterStat : ${estudiantes}">
                                <td th:text="${iterStat.count}">1</td>
                                <td th:text="${estudiante.dni}">-</td>
                                <td th:text="${estudiante.apellidoPaterno} + ' ' + ${estudiante.apellidoMaterno} + ', ' + ${estudiante.nombres}">-</td>
                                <td th:text="${estudiante.emailInstitucional}">-</td>
                                <td><span class="status-badge status-active" th:if="${estudiante.estado == 'ACTIVO'}" th:text="${estudiante.estado}">ACTIVO</span></td>
                            </tr>
                            <tr th:if="${estudiantes == null or estudiantes.empty}">
                                <td colspan="5" class="text-center py-5">No hay estudiantes matriculados en este curso.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
