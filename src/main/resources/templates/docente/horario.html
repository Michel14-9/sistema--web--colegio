<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. San Carlos - Mi Horario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/docente.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/docente-navbar :: navbar}">
    <div th:with="tituloPagina='Mi Horario'"></div>
</div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/docente-sidebar :: sidebar}">
            <div th:with="modulo='horario'"></div>
        </div>

        <div class="col-md-10 col-lg-10 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="fas fa-calendar-alt me-2 text-primary"></i>
                    Mi Horario de Clases
                </h1>
                <div>
                    <span class="text-muted" th:if="${docente != null}">
                        <i class="fas fa-user-tie me-1"></i>
                        <strong th:text="${docente.nombres} + ' ' + ${docente.apellidoPaterno}"></strong>
                    </span>
                    <span class="text-muted ms-3">
                        <i class="fas fa-book me-1"></i>
                        Total: <strong th:text="${cursos != null ? cursos.size() : 0}"></strong> cursos
                    </span>
                </div>
            </div>

            <!-- Mensaje si no tiene cursos -->
            <div th:if="${cursos == null or cursos.empty}" class="alert alert-warning">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <strong>No tienes cursos asignados.</strong>
                <p class="mb-0 mt-1">Contacta con el administrador para que te asignen cursos.</p>
            </div>

            <!-- Horario dinámico -->
            <div th:if="${cursos != null and !cursos.empty}">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-clock me-2"></i> Horario Semanal</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover">
                                <thead class="table-dark">
                                <tr>
                                    <th style="width: 120px;">Hora</th>
                                    <th th:each="dia : ${dias}" th:text="${dia}" class="text-center"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="hora : ${horasOrdenadas}">
                                    <td>
                                        <strong th:text="${hora} + ':00 - ' + (hora + 1) + ':00'"></strong>
                                    </td>
                                    <td th:each="dia : ${dias}">
                                        <div th:each="curso : ${horarioPorDia.get(dia).get(hora)}">
                                            <span class="badge bg-info d-block mb-1" th:text="${curso.nombreCurso}"></span>
                                            <small class="text-muted d-block" th:text="'Código: ' + ${curso.codigoCurso}"></small>
                                            <small class="text-muted d-block" th:text="'Sección: ' + ${curso.seccion}"></small>
                                            <small class="text-muted d-block" th:text="'Horario: ' + ${curso.horario}"></small>
                                            <hr class="my-1" th:if="${not cursoStat.last}">
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${horasOrdenadas == null or horasOrdenadas.empty}">
                                    <td colspan="6" class="text-center py-4">
                                        <i class="fas fa-clock fa-3x text-muted d-block mb-2"></i>
                                        <p class="text-muted">No hay horarios configurados para tus cursos.</p>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Resumen de cursos -->
                <div class="row mt-3">
                    <div class="col-md-4">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h5 class="card-title text-primary">
                                    <i class="fas fa-book me-2"></i>
                                    Total Cursos
                                </h5>
                                <h2 class="display-6" th:text="${cursos != null ? cursos.size() : 0}">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h5 class="card-title text-success">
                                    <i class="fas fa-users me-2"></i>
                                    Total Alumnos
                                </h5>
                                <h2 class="display-6" th:text="${totalAlumnos != null ? totalAlumnos : 0}">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h5 class="card-title text-info">
                                    <i class="fas fa-clock me-2"></i>
                                    Horas Semanales
                                </h5>
                                <h2 class="display-6" th:text="${totalHoras != null ? totalHoras : 0}">0</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
