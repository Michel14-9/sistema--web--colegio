<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Matrícula</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link th:href="@{/static/css/estudiante.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid"> <a class="navbar-brand" href="/estudiante/dashboard.html"> <i
                    class="fas fa-chalkboard-teacher me-2"></i> Sistema Académico - Estudiante </a>
            <div class="dropdown"> <button class="btn btn-light dropdown-toggle" type="button"
                    data-bs-toggle="dropdown"> <i class="fas fa-user-circle me-1"></i> 
                    <span th:text="${docente.nombres}"></span> <span th:text="${docente.apellidos}"></span> </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="/logout"> <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                        </a></li>
                </ul>
            </div>
        </div>
    </nav>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-0">
                <ul class="nav flex-column pt-3">
                    <li class="nav-item"> <a class="nav-link" href="/estudiante/dashboard.html"> <i
                                class="fas fa-tachometer-alt me-2"></i> Dashboard </a> </li>
                    <li class="nav-item"> <a class="nav-link" href="/estudiante/mis-cursos"> <i
                                class="fas fa-book me-2"></i> Mis Cursos </a> </li>
                    <li class="nav-item"> <a class="nav-link" href="/estudiante/cursos-disponibles.html"> <i
                                class="fas fa-list me-2"></i> Cursos Disponibles </a> </li>
                    <li class="nav-item"> <a class="nav-link" href="/estudiante/docentes-disponibles.html"> <i
                                class="fas fa-chalkboard-teacher me-2"></i> Docentes </a> </li>
                    <li class="nav-item"> <a class="nav-link active" href="/estudiante/mi-matricula.html"> <i
                                class="fas fa-file-signature me-2"></i> Mi Matrícula </a> </li>
                </ul>
            </div>

        <!-- CONTENIDO -->
        <div class="col-md-10 p-4">

            <h2 class="mb-4">Mi Matrícula</h2>

            <div class="card">
                <div class="card-body">

                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>Curso:</th>
                            <th>Creditos: 12</th>
                            <th>Estado:</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="m : ${matriculas}">
                            <td th:text="${m.curso.nombre}">Matemáticas</td>
                            <td th:text="${m.curso.creditos}">Creditos: 4</td>
                            <td>
                                <span class="badge bg-primary" th:text="${m.estado}">Matriculado</span>
                            </td>
                        </tr>
                         <tr th:each="m : ${matriculas}">
                            <td th:text="${m.curso.nombre}">Comunicación</td>
                            <td th:text="${m.curso.creditos}">Creditos: 3</td>
                            <td>
                                <span class="badge bg-primary" th:text="${m.estado}">Matriculado</span>
                            </td>
                        </tr>
                         <tr th:each="m : ${matriculas}">
                            <td th:text="${m.curso.nombre}">Civica</td>
                            <td th:text="${m.curso.creditos}">Creditos: 5</td>
                            <td>
                                <span class="badge bg-primary" th:text="${m.estado}">Matriculado</span>
                            </td>
                        </tr>


                       
                        </tbody>


                    </table>
                    <div class="mt-3 text-end">
                                <a href="/estudiante/cursos-disponibles.html" class="btn btn-success">
                                + Agregar cursos
                                </a>
                                </div>

                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
