<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Matrícula - Estudiante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link th:href="@{/css/estudiante.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/estudiante/dashboard">
            <i class="fas fa-user-graduate me-2"></i>
            Sistema Académico - Estudiante
        </a>
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="fas fa-user-circle me-1"></i>
                <span th:text="${#authentication.name}"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="dropdown-item" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer;">
                            <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-0 bg-light">
            <ul class="nav flex-column pt-3">
                <li class="nav-item">
                    <a class="nav-link" href="/estudiante/dashboard">
                        <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/estudiante/cursos">
                        <i class="fas fa-book me-2"></i> Mis Cursos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/estudiante/cursos-disponibles">
                        <i class="fas fa-list me-2"></i> Cursos Disponibles
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/estudiante/docentes-disponibles">
                        <i class="fas fa-chalkboard-teacher me-2"></i> Docentes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/estudiante/matricula">
                        <i class="fas fa-file-signature me-2"></i> Mi Matrícula
                    </a>
                </li>
            </ul>
        </div>

        <!-- CONTENIDO -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="fas fa-file-signature me-2 text-primary"></i>
                    Mi Matrícula
                </h1>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead class="table-light">
                            <tr>
                                <th>Curso</th>
                                <th>Código</th>
                                <th>Horas</th>
                                <th>Estado</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="matricula : ${matriculas}">
                                <td th:text="${matricula.curso.nombreCurso}">-</td>
                                <td th:text="${matricula.curso.codigoCurso}">-</td>
                                <td th:text="${matricula.curso.horasSemanales}">-</td>
                                <td>
                                        <span class="badge"
                                              th:class="${matricula.estado == 'ACTIVO'} ? 'bg-success' : 'bg-warning'"
                                              th:text="${matricula.estado}">ACTIVO</span>
                                </td>
                            </tr>
                            <tr th:if="${matriculas == null or matriculas.empty}">
                                <td colspan="4" class="text-center py-4">
                                    <i class="fas fa-file-signature fa-3x text-muted d-block mb-2"></i>
                                    No tienes cursos matriculados
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-3 text-end">
                        <a href="/estudiante/cursos-disponibles" class="btn btn-success">
                            <i class="fas fa-plus me-1"></i> Agregar cursos
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
