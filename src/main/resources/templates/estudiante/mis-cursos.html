<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Cursos - Estudiante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link th:href="@{/css/estudiante.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/estudiante/dashboard">
            <i class="fas fa-user-graduate me-2"></i>
            Sistema Académico - Estudiante
        </a>

        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="fas fa-user-circle me-1"></i>
                <span th:text="${#authentication.name}"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="dropdown-item" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer;">
                            <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-0 bg-light">
            <ul class="nav flex-column pt-3">
                <li class="nav-item">
                    <a class="nav-link" href="/estudiante/dashboard">
                        <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/estudiante/cursos">
                        <i class="fas fa-book me-2"></i> Mis Cursos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/estudiante/matricula">
                        <i class="fas fa-file-signature me-2"></i> Mi Matrícula
                    </a>
                </li>
            </ul>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="fas fa-book me-2 text-primary"></i>
                    Mis Cursos
                </h1>
            </div>

            <div class="row">
                <!-- Card dinámico desde la base de datos -->
                <div class="col-md-4 mb-4" th:each="curso : ${cursos}">
                    <div class="card h-100 shadow-sm border-0">
                        <img src="https://img.freepik.com/vector-gratis/pequenos-estudiantes-gran-signo-pi-ilustracion-vectorial-plana-nino-nina-estudiando-matematicas-algebra-escuela-o-universidad-sosteniendo-regla-usando-computadora-portatil-figuras-geometricas-segundo-plano-concepto-educacion_74855-23227.jpg"
                             class="card-img-top" alt="Curso">
                        <div class="card-body">
                            <h5 class="fw-bold" th:text="${curso.nombreCurso}">-</h5>
                            <p class="text-muted small" th:text="${curso.descripcion ?: 'Sin descripción'}">-</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="badge" th:class="${curso.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${curso.estado}">-</span>
                                <small class="text-muted">
                                    <i class="fas fa-code me-1"></i>
                                    <span th:text="${curso.codigoCurso}">-</span>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Mensaje cuando no hay cursos -->
                <div th:if="${cursos == null or cursos.empty}" class="col-12">
                    <div class="alert alert-info text-center py-5">
                        <i class="fas fa-book-open fa-4x mb-3 d-block text-muted"></i>
                        <h5>No tienes cursos matriculados</h5>
                        <p>Actualmente no estás matriculado en ningún curso.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
